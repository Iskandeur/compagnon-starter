# Déploiement auto-suffisant : conteneur app + tunnel Cloudflare "quick" dédié. Réseau propre à ce
# projet — ce dashboard n'a besoin de parler à rien d'autre que la base SQLite et le dépôt git du
# harnais, montés en lecture seule.
#
# Secrets (ACCESS_PIN, ACCESS_SESSION_SECRET) : dans .env (git-ignoré), jamais committés.

name: compagnon-dashboard

services:
  app:
    build: .
    container_name: compagnon-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8790}:8080"
      # Seconde liaison, 172.17.0.1 : le gateway du bridge Docker PAR DÉFAUT (docker0), distinct du
      # gateway d'un éventuel réseau Compose custom sur lequel tournerait un autre de tes services
      # (ex. un reverse proxy/tunnel dans une AUTRE stack docker-compose). `extra_hosts:
      # host.docker.internal:host-gateway` résout TOUJOURS vers docker0, quel que soit le réseau
      # applicatif du conteneur appelant. Sans cette 2e liaison, un ingress externe pointé sur
      # host.docker.internal:${HOST_PORT} peut tomber en 502 (le port n'était publié que sur
      # 127.0.0.1). Trouvaille en usage réel — adapte/retire si ton architecture réseau diffère.
      - "172.17.0.1:${HOST_PORT:-8790}:8080"
    environment:
      ACCESS_PIN: ${ACCESS_PIN}
      ACCESS_SESSION_SECRET: ${ACCESS_SESSION_SECRET}
      DASHBOARD_DB_PATH: /data/compagnon.sqlite
      DASHBOARD_REPO_PATH: /repo
      DASHBOARD_DAEMON_HEALTH_URL: http://host.docker.internal:8787/health
      DASHBOARD_SETTINGS_URL: http://host.docker.internal:8787/settings
      DASHBOARD_SETTINGS_TOKEN: ${DASHBOARD_SETTINGS_TOKEN}
      GROUP_CHAT_ID: ${GROUP_CHAT_ID}
    volumes:
      # Base du harnais et dépôt git — LECTURE SEULE (:ro). Les valeurs par défaut ci-dessous sont
      # des exemples ; définis toujours COMPAGNON_DB_PATH/COMPAGNON_REPO_PATH dans .env pour ton
      # propre hôte.
      - ${COMPAGNON_DB_PATH:-/home/<user>/mon-compagnon/data/compagnon.sqlite}:/data/compagnon.sqlite:ro
      - ${COMPAGNON_REPO_PATH:-/home/<user>/mon-compagnon}:/repo:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default]

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: compagnon-dashboard-tunnel
    restart: unless-stopped
    command: tunnel --url http://app:8080
    depends_on: [app]
    networks: [default]

networks:
  default:
    name: compagnon-dashboard_default
